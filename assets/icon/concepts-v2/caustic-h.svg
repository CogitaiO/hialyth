<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="0.55" stop-color="#0C0E14"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#AEBDFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E0FF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- Glass pane -->
  <rect x="170" y="170" width="684" height="684" rx="140" fill="url(#pane)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"/>
  <path d="M214 330 L430 190" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="22" stroke-linecap="round"/>
  <path d="M214 420 L360 190" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round"/>

  <!-- Refracted H -->
  <g opacity="0.34" transform="translate(-12 -10)">
    <rect x="330" y="330" width="92" height="364" rx="28" fill="#6EE7F9"/>
    <rect x="602" y="330" width="92" height="364" rx="28" fill="#6EE7F9"/>
    <rect x="422" y="492" width="180" height="40" rx="20" fill="#6EE7F9"/>
  </g>
  <g opacity="0.30" transform="translate(12 10)">
    <rect x="330" y="330" width="92" height="364" rx="28" fill="#D8A7FF"/>
    <rect x="602" y="330" width="92" height="364" rx="28" fill="#D8A7FF"/>
    <rect x="422" y="492" width="180" height="40" rx="20" fill="#D8A7FF"/>
  </g>
  <g>
    <rect x="330" y="330" width="92" height="364" rx="28" fill="url(#light)"/>
    <rect x="602" y="330" width="92" height="364" rx="28" fill="url(#light)"/>
    <rect x="422" y="492" width="180" height="40" rx="20" fill="url(#light)"/>
  </g>
</svg>
