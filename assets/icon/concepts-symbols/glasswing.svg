  <!-- Body -->
  <path d="M512 318 L544 520 L512 770 L480 520 Z" fill="url(#body)" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="5" stroke-linejoin="round"/>
  <path d="M512 332 L526 520 L512 748 L498 520 Z" fill="#FFFFFF" fill-opacity="0.36"/>
