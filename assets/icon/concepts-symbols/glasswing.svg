  <g stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5" stroke-linejoin="round">
    <path d="M474 540 L350 590 L300 714 L410 780 L500 660 Z" fill="url(#wing2)"/>
    <path d="M550 540 L674 590 L724 714 L614 780 L524 660 Z" fill="url(#wing)"/>
  </g>
