  <g opacity="0.8">
    <path d="M474 540 L350 590 L500 660 Z" fill="#FFFFFF" fill-opacity="0.10"/>
    <path d="M350 590 L300 714 L410 780 Z" fill="#0B1024" fill-opacity="0.10"/>
