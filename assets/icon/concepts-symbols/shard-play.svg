<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B27"/>
      <stop offset="0.55" stop-color="#0D0F16"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.35" stop-color="#E2E8FF" stop-opacity="0.72"/>
      <stop offset="0.72" stop-color="#A7B5F1" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#6472C4" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DDE5FF"/>
      <stop offset="1" stop-color="#A9B8FF"/>
    </linearGradient>
    <radialGradient id="caustic" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B9A7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9A7FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- Shard silhouette -->
  <path d="M528 124 L728 352 L660 704 L504 892 L368 716 L308 356 Z"
        fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.44" stroke-width="5" stroke-linejoin="round"/>

  <!-- Facets -->
  <path d="M528 124 L308 356 L368 716 L504 892 Z" fill="#FFFFFF" fill-opacity="0.06"/>
  <path d="M528 124 L728 352 L660 704 L504 892 Z" fill="#0B1024" fill-opacity="0.16"/>
  <path d="M528 124 L728 352 L528 400 L308 356 Z" fill="#FFFFFF" fill-opacity="0.16"/>
  <path d="M504 892 L660 704 L504 636 L368 716 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M528 124 L308 356 L368 716 L504 892 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M528 124 L728 352 L660 704 L504 892 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Caustic play void -->
  <ellipse cx="512" cy="520" rx="180" ry="160" fill="url(#caustic)"/>
  <path d="M448 408 L448 632 L636 520 Z"
        fill="#07080B" fill-opacity="0.96"
        stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="6" stroke-linejoin="round"/>
  <path d="M448 408 L448 632 L636 520 Z"
        fill="none" stroke="#B9A7FF" stroke-opacity="0.24" stroke-width="18" stroke-linejoin="round"/>
  <path d="M470 446 L470 594 L584 520 Z" fill="url(#light)" fill-opacity="0.16"/>
